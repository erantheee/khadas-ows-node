[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "khadas-ows-node"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26", "torch>=2.2", "onnx>=1.15", "onnxscript>=0.5"]
[project.optional-dependencies]
test = ["pytest>=8", "onnxruntime>=1.16"]
[tool.setuptools]
package-dir = {"" = "python"}
[tool.setuptools.packages.find]
where = ["python"]

